name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Bastion.sln

      - name: Build
        run: dotnet build Bastion.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/Bastion.Core.Tests -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish
        shell: pwsh
        run: |
          $out = "publish/Bastion"
          dotnet publish src/Bastion.App -c Release -r win-x64 --self-contained true -o $out
          dotnet publish src/Bastion.Service -c Release -r win-x64 --self-contained true -o $out
          Copy-Item scripts/install.ps1, scripts/uninstall.ps1 $out
          Copy-Item README.md, LICENSE $out
          Copy-Item scripts/setup-licensing.ps1 $out
          dotnet publish tools/Bastion.LicenseManager -c Release -r win-x64 --self-contained true -o publish/LicenseManager

      - name: Build installer
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          choco install innosetup -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" "/DSourceDir=..\publish\Bastion" installer\Bastion.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Get-ChildItem publish\Bastion-Setup-*.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Bastion-Setup
          path: publish/Bastion-Setup-*.exe

      - name: Upload License Manager
        uses: actions/upload-artifact@v4
        with:
          name: Bastion-LicenseManager-win-x64
          path: publish/LicenseManager

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Bastion-win-x64
          path: publish/Bastion

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path publish/Bastion/* -DestinationPath "Bastion-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path publish/LicenseManager/* -DestinationPath "Bastion-LicenseManager-${{ github.ref_name }}-win-x64.zip"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/Bastion-Setup-*.exe
            Bastion-${{ github.ref_name }}-win-x64.zip
            Bastion-LicenseManager-${{ github.ref_name }}-win-x64.zip
          # Keep the notes written on GitHub; only attach the build.
          generate_release_notes: false
